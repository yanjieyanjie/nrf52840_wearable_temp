# =========================
# Basic
# =========================

CONFIG_PRINTK=y
CONFIG_GPIO=y


# =========================
# DS18B20
# =========================

CONFIG_SENSOR=y
CONFIG_W1=y


# =========================
# OLED
# =========================

CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y

CONFIG_HEAP_MEM_POOL_SIZE=2048


# =========================
# Bluetooth LE
# =========================

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

CONFIG_BT_DEVICE_NAME="WearableTemp"


# =========================
# BLE Security
# =========================

# Security Manager Protocol
CONFIG_BT_SMP=y

# 允许 Bonding
CONFIG_BT_BONDABLE=y

# Bluetooth Bond/Keys 保存到 Settings
CONFIG_BT_SETTINGS=y

# 最多保存 4 个 Bond
CONFIG_BT_MAX_PAIRED=4


# =========================
# Flash / Settings / NVS
# =========================

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

CONFIG_NVS=y

CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y